<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <!-- Google Fonts: Overpass (필수: Tailwind config에서 사용) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS 빌드된 파일 -->
  <link rel="stylesheet" href="./dist/output.css">

  <title>Interactive rating component</title>
</head>

<body>

  <!-- Rating State (평점 입력 화면) -->
  <main id="rating-state" class="min-h-screen flex items-center justify-center p-spacing-300">
    <!-- 카드 컨테이너 -->
    <article
      class="w-[327px] p-6 md:w-[399px] md:h-[411px] bg-gradient-to-b from-grey-800 to-grey-850 rounded-[15px] sm:rounded-[30px] md:px-spacing-300 md:py-spacing-400 flex flex-col justify-center">

      <!-- 별 아이콘 -->
      <div
        class="w-10 h-10 sm:w-12 sm:h-12 bg-grey-900 rounded-full flex items-center justify-center mb-6 md:mb-spacing-400">
        <img src="./images/icon-star.svg" alt="" aria-hidden="true">
      </div>

      <!-- 제목 -->
      <h1 class="text-white text-preset-2 md:text-preset-1 font-bold mb-4 md:mb-spacing-100">
        How did we do?
      </h1>

      <!-- 설명 텍스트 -->
      <p class="text-grey-500 text-preset-5 md:text-preset-4 mb-spacing-200">
        Please let us know how we did with your support request. All feedback is appreciated to help us improve our
        offering!
      </p>

      <!-- 평점 선택 폼 -->
      <form id="rating-form" class="mb-spacing-300 sm:mb-spacing-400 w-full">
        <div class="flex justify-center gap-4 md:gap-spacing-300">
          <!-- 평점 버튼 1 -->
          <div>
            <input type="radio" name="rating" id="rating-1" value="1" class="sr-only peer">
            <label for="rating-1"
              class="rating-btn w-[42px] h-[42px] md:w-[51px] md:h-[51px] text-preset-5-bold md:sm:text-preset-3 peer-checked:rating-btn-selected focus-within:outline focus-within:outline-2 focus-within:outline-orange-500">
              1
            </label>
          </div>

          <!-- 평점 버튼 2 -->
          <div>
            <input type="radio" name="rating" id="rating-2" value="2" class="sr-only peer">
            <label for="rating-2"
              class="rating-btn w-[42px] h-[42px] md:w-[51px] md:h-[51px] text-preset-5-bold md:sm:text-preset-3 peer-checked:rating-btn-selected focus-within:outline focus-within:outline-2 focus-within:outline-orange-500">
              2
            </label>
          </div>

          <!-- 평점 버튼 3 -->
          <div>
            <input type="radio" name="rating" id="rating-3" value="3" class="sr-only peer">
            <label for="rating-3"
              class="rating-btn w-[42px] h-[42px] md:w-[51px] md:h-[51px] text-preset-5-bold md:sm:text-preset-3 peer-checked:rating-btn-selected focus-within:outline focus-within:outline-2 focus-within:outline-orange-500">
              3
            </label>
          </div>

          <!-- 평점 버튼 4 -->
          <div>
            <input type="radio" name="rating" id="rating-4" value="4" class="sr-only peer">
            <label for="rating-4"
              class="rating-btn w-[42px] h-[42px] md:w-[51px] md:h-[51px] text-preset-5-bold md:sm:text-preset-3 peer-checked:rating-btn-selected focus-within:outline focus-within:outline-2 focus-within:outline-orange-500">
              4
            </label>
          </div>

          <!-- 평점 버튼 5 -->
          <div>
            <input type="radio" name="rating" id="rating-5" value="5" class="sr-only peer">
            <label for="rating-5"
              class="rating-btn w-[42px] h-[42px] md:w-[51px] md:h-[51px] text-preset-5-bold md:sm:text-preset-3 peer-checked:rating-btn-selected focus-within:outline focus-within:outline-2 focus-within:outline-orange-500">
              5
            </label>
          </div>
        </div>
      </form>

      <!-- 제출 버튼 -->
      <button type="submit" form="rating-form"
        class="w-full bg-orange-500 text-grey-950 text-preset-5-bold md:text-preset-5-semibold uppercase rounded-full py-4 md:py-[12.5px] transition-colors hover:bg-white hover:text-orange-500 focus:outline focus:outline-2 focus:outline-offset-2 focus:outline-orange-500">
        Submit
      </button>

    </article>
  </main>

  <!-- Thank You State (감사 화면) -->
  <main id="thankyou-state" class="hidden min-h-screen flex items-center justify-center p-spacing-300">
    <!-- 카드 컨테이너 -->
    <article
      class="w-[327px] p-6 md:w-[399px] md:h-[411px] bg-gradient-to-b from-grey-800 to-grey-850 rounded-[15px] sm:rounded-[30px] md:px-spacing-300 md:py-spacing-400 flex flex-col items-center justify-center text-center">

      <!-- 감사 이미지 -->
      <div class="flex justify-center mb-spacing-300 sm:mb-spacing-400">
        <img src="./images/illustration-thank-you.svg" alt="" aria-hidden="true">
      </div>

      <!-- 선택된 평점 표시 -->
      <p
        class="inline-block bg-grey-900 text-orange-500 text-preset-5 sm:text-preset-4 px-5 py-2 rounded-full mb-spacing-300 sm:mb-spacing-400">
        You selected <span id="selected-rating">0</span> out of 5
      </p>

      <!-- 감사 제목 -->
      <h1 class="text-white text-preset-2 sm:text-preset-1 font-bold mb-spacing-100 sm:mb-spacing-200">
        Thank you!
      </h1>

      <!-- 감사 메시지 -->
      <p class="text-grey-500 text-preset-5 sm:text-preset-4">
        We appreciate you taking the time to give a rating. If you ever need more support, don't hesitate to get in
        touch!
      </p>

    </article>
  </main>

  <!-- JavaScript 파일 연결: defer를 사용하여 HTML 파싱 완료 후 실행 -->
  <script src="./src/main.js" defer></script>

</body>

</html>
